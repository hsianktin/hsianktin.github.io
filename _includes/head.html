<!DOCTYPE html>
<html lang="en" dir="ltr" data-palette="{{ site.palette | default: 'slate' }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description | strip_newlines }}{% endif %}">
    <meta name="author" content="{{ site.author }}">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)">
    <link rel="shortcut icon" href="{{ site.baseurl }}/assets/favicon.ico" type="image/x-icon">
    <link rel="icon" href="{{ site.baseurl }}/assets/icon.svg" type="image/svg+xml">
    <link href='{{ site.baseurl }}/feed.xml' rel='alternate' type='application/atom+xml'>
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
    <script>
        (function () { var d = document.documentElement, p = '{{ site.palette | default: "slate" }}'; try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') { d.setAttribute('data-theme', t); } {% if site.palette_picker %}var s = localStorage.getItem('palette'); if (s) { p = s; } {% endif %}var q = /[?&]palette=([a-z]+)/.exec(location.search); if (q) { p = q[1]; } } catch (e) { } d.setAttribute('data-palette', p); d.classList.add('js'); })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/style.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/palettes.css">
    <script defer src="{{ site.baseurl }}/assets/site.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.1/MathJax.js?config=TeX-AMS_HTML">
        MathJax.Hub.Config({
          "HTML-CSS": {
            availableFonts: ["TeX"],
          },
          tex2jax: {
            inlineMath: [['$','$'],["\\(","\\)"]]},
            displayMath: [ ['$$','$$'], ['\[','\]'] ],
          TeX: {
            extensions: ["AMSmath.js", "AMSsymbols.js", "color.js"],
            equationNumbers: {
              autoNumber: "AMS"
            }
          },
          showProcessingMessages: false,
          messageStyle: "none",
          imageFont: null,
          "AssistiveMML": { disabled: true }
        });
      </script>
</head>

<body class="{% if page.url == '/' %}is-home{% endif %} layout-{{ page.layout }}">
<a class="skip-link" href="#content">Skip to content</a>
