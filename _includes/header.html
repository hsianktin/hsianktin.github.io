<header class="site-header">
    <div class="header-inner">
        <a class="brand" href="{{ site.baseurl }}/" aria-label="{{ site.title }}, home">
            <svg class="brand-mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
                <defs><linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs>
                <rect width="32" height="32" rx="8" fill="url(#brand-grad)"/>
                <path d="M5 24.5H27" stroke="var(--bg)" stroke-opacity=".4" stroke-width="1.2" stroke-linecap="round"/>
                <path class="brand-trace" d="M6 19 L8.5 15 L10.5 20 L13 12 L15.5 17 L17.5 9.5 L20 16 L22 13 L24 21 L26 14.5" fill="none" stroke="var(--bg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
                <circle cx="26" cy="14.5" r="2.1" fill="var(--bg)"/>
            </svg>
            <span class="brand-name">{{ site.title }}</span>
        </a>

        <button class="icon-btn nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>

        <nav id="site-nav" class="site-nav" aria-label="Main">
            <a href="{{ site.baseurl }}/" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
            {% for link in site.links %}
            {% assign target = link[1] %}
            <a href="{% if target contains '://' %}{{ target }}{% else %}{{ site.baseurl }}{{ target }}{% endif %}"
               {% if page.url == target or page.url == target | append: '.html' %}aria-current="page"{% endif %}
               {% if target contains '.pdf' %}target="_blank" rel="noopener"{% endif %}>{{ link[0] }}</a>
            {% endfor %}
            {% for link in site.special_links %}
            <a href="{{ link[1] }}">{{ link[0] }}</a>
            {% endfor %}
        </nav>

        <button class="icon-btn theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
            <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
    </div>
    <div class="read-progress" aria-hidden="true"></div>
</header>
