---
layout: compress
---

{% include head.html %}

    {% include header.html %}

    <main id="content" class="container">

        <article class="post">
            <header class="post-header">
                <p class="post-meta">
                    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
                    {% for tag in page.tags %}<a class="tag" href="{{ site.baseurl }}/tagged/{{ tag }}/">#{{ tag }}</a>{% endfor %}
                </p>
                <h1 class="page-title">{{ page.title }}</h1>
                {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
            </header>

            <div class="post-body">
                {{ content }}
            </div>
        </article>

        {% include footer-post.html %}

    </main>

</body>

</html>
